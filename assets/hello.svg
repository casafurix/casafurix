<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">やあ、agnibha です</title>
<desc id="desc">AI engineer. Building apps that think. An original pixel cat bats at the terminal cursor beside a little music visualizer.</desc>
<style>
text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.sub { fill: #ACB2D0; }
.mint { fill: #A7E8CB; }
.lavender { fill: #DFCEFF; }
.reveal { animation: type 16s linear infinite; }
.greeting { animation: greeting 16s linear infinite; }
.intro { animation: intro 16s linear infinite; }
.cursor { animation: cursor 16s linear infinite; }
.paw { animation: paw 16s steps(1,end) infinite; }
.eye { animation: blink 16s steps(1,end) infinite; }
.tail { animation: tail 16s steps(1,end) infinite; transform-origin: 92px 56px; }
.note { animation: note 16s ease-out infinite; }
.bar { animation: beat 1.4s steps(4,end) infinite; transform-box: fill-box; transform-origin: bottom; }
@keyframes type { 0%,2% { clip-path: inset(0 100% 0 0); } 8%,94% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
@keyframes greeting { 0%,8% { opacity: 0; } 10%,94% { opacity: 1; } 99%,100% { opacity: 0; } }
@keyframes intro { 0%,11% { opacity: 0; } 14%,94% { opacity: 1; } 99%,100% { opacity: 0; } }
@keyframes cursor { 0%,32% { opacity: 0; } 0%,51%,66%,100% { transform: translateX(0); } 34%,39%,44%,49%,66%,71%,76%,81%,86%,91% { opacity: 1; } 41%,46%,51%,69%,74%,79%,84%,89%,94%,100% { opacity: 0; } 53%,64% { opacity: 1; transform: translateX(26px); } }
@keyframes paw { 0%,51%,66%,100% { transform: translate(0,0); } 53%,57%,61% { transform: translate(-17px,-9px); } 55%,59%,64% { transform: translate(-10px,-3px); } }
@keyframes blink { 0%,35%,38%,73%,76%,100% { opacity: 1; } 36%,37%,74%,75% { opacity: 0; } }
@keyframes tail { 0%,33%,66%,100% { transform: rotate(0deg); } 17%,50%,83% { transform: rotate(-12deg); } }
@keyframes note { 0%,52% { opacity:0; transform:translateY(0); } 55% { opacity:1; } 66%,100% { opacity:0; transform:translateY(-24px); } }
@keyframes beat { 0%,100% { transform:scaleY(.4); } 25% { transform:scaleY(.8); } 50% { transform:scaleY(1); } 75% { transform:scaleY(.6); } }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; } .note { opacity:0; } }
</style>
